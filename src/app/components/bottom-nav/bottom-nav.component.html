<nav class="bottom-nav">

  @for (item of navItems; track item) {
    <a
      [routerLink]="item.path"
      class="nav-item">
      <ion-icon
      [name]="isActive(item.path)
      ? item.activeIcon
      : item.icon"
        [class.active]="isActive(item.path)">
      </ion-icon>
      <span
        [class.active]="isActive(item.path)">
        {{ item.label }}
      </span>
    </a>
  }

</nav>
